<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23114b86'/%3E%3Cpath fill='%23fff' d='M12 4C9 4 7 4.4 7 6.6v6.6a2.4 2.4 0 0 0 2.4 2.4L8.4 16.6v.4h1.5l1.4-1.4h1.4L14.1 17h1.5v-.4l-1-1a2.4 2.4 0 0 0 2.4-2.4V6.6C17 4.4 15 4 12 4zM9.6 14a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm1.6-4.4H8.4V7.4h2.8zm1.6 0V7.4h2.8v2.2zm1.6 4.4a1 1 0 1 1 0-2 1 1 0 0 1 0 2z'/%3E%3C/svg%3E" />
<title>Bereikbaarheid Gent met de trein — Vlaamse Ardennen</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#114b86; --navy-d:#0d3c6e; --ink:#17364f; --paper:rgba(255,255,255,.93);
  --edge:rgba(23,54,79,.22); --shadow:0 10px 30px rgba(10,35,60,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:#dfe3da;overflow:hidden}
#map{position:absolute;inset:0;background:#e9e7de}
.leaflet-container{font-family:inherit}
.leaflet-pane.base-pane img{filter:saturate(.45) contrast(.95) brightness(1.04) sepia(.12)}

.card{background:var(--paper);border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em}

#title{position:absolute;z-index:900;left:18px;top:18px;display:flex;gap:16px;align-items:center;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff;border-radius:16px;
  padding:14px 26px 14px 18px;box-shadow:0 14px 34px rgba(8,30,55,.38);max-width:min(620px,46vw);
  animation:drop .7s cubic-bezier(.2,.9,.3,1) both}
#title>svg{flex:none;width:46px;height:46px;padding-right:16px;border-right:1px solid rgba(255,255,255,.28)}
#title h1{margin:0;font-size:clamp(19px,2.1vw,31px);font-weight:800;letter-spacing:-.025em;line-height:1.08}
#title h2{margin:2px 0 0;font-size:clamp(14px,1.45vw,21px);font-weight:600;opacity:.95;line-height:1.15}
#title p{margin:7px 0 0;font-size:11.5px;line-height:1.45;opacity:.82;max-width:46ch}

#right{position:absolute;z-index:900;right:18px;top:18px;bottom:52px;width:332px;
  display:flex;flex-direction:column;gap:12px;pointer-events:none}
#right>*{pointer-events:auto;animation:slide .7s .12s cubic-bezier(.2,.9,.3,1) both}
#right>*:nth-child(2){animation-delay:.2s}#right>*:nth-child(3){animation-delay:.28s}

#legend{padding:14px 16px}
.band{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:3px 5px;margin:0 -5px;border-radius:7px;cursor:pointer;transition:background .15s}
.band:hover{background:rgba(17,75,134,.09)}
.band.off{opacity:.33}
.sw{width:30px;height:15px;border-radius:3px;border:1px solid rgba(0,0,0,.22);flex:none}
.band .q{opacity:.62}
.band .pct{margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px;opacity:.6;font-weight:600}
.sep{height:1px;background:var(--edge);margin:11px 0 9px}
.sym{display:flex;align-items:center;gap:9px;font-size:12px;margin:5px 0;line-height:1.25}
.sym i{flex:none;width:30px;display:flex;justify-content:center}

#times{padding:14px 16px 12px;flex:1;display:flex;flex-direction:column;min-height:150px}
#q{width:100%;margin:2px 0 8px;padding:7px 10px;border:1px solid var(--edge);border-radius:9px;font:inherit;font-size:12.5px;background:rgba(255,255,255,.75)}
#q:focus{outline:2px solid rgba(17,75,134,.35);outline-offset:-1px}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none;scrollbar-width:thin}
#list li{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12.5px;border-radius:7px;cursor:pointer;transition:background .12s,transform .12s}
#list li:nth-child(odd){background:rgba(17,75,134,.065)}
#list li:hover{background:rgba(17,75,134,.18);transform:translateX(2px)}
#list li .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list li b{font-variant-numeric:tabular-nums;font-weight:700}
#list li .dot{width:7px;height:7px;border-radius:50%;flex:none;background:#9fb3c4}
#list li .dot.direct{background:var(--navy);box-shadow:0 0 0 2.5px rgba(17,75,134,.22)}
.note{font-size:10.5px;line-height:1.5;opacity:.68;margin-top:9px}
.note a{color:var(--navy)}

#ctl{padding:12px 16px 14px}
.seg{display:flex;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--navy);padding:7px 4px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .18s,color .18s}
.seg button.on{background:var(--navy);color:#fff}
.opt{display:flex;align-items:center;gap:9px;font-size:12.5px;margin:8px 0;cursor:pointer}
.opt input{accent-color:var(--navy);width:15px;height:15px;cursor:pointer}
.rng{display:flex;align-items:center;gap:10px;font-size:12px;margin:9px 0 2px}
.rng input{flex:1;accent-color:var(--navy);cursor:pointer;min-width:0}
.rng b{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11.5px}

#slogan{position:absolute;z-index:850;left:22px;bottom:118px;font-family:Caveat,cursive;font-size:38px;
  line-height:.95;color:var(--navy-d);text-shadow:0 2px 10px rgba(255,255,255,.95);pointer-events:none;
  animation:fade 1s .7s both}
#slogan::after{content:"";display:block;width:132px;height:9px;margin-top:6px;
  border-bottom:3px solid var(--navy-d);border-radius:0 0 60% 60%/0 0 100% 100%}

#probe{position:absolute;z-index:900;left:22px;bottom:240px;padding:11px 15px;font-size:12.5px;line-height:1.5;
  max-width:330px;display:none}
#probe .h{font-weight:800;color:var(--navy);font-size:13px}
#probe .v{font-variant-numeric:tabular-nums}

#status{position:absolute;z-index:1200;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 26px;
  font-size:13.5px;text-align:center;min-width:290px;max-width:440px}
#status .bar{height:4px;border-radius:3px;background:rgba(17,75,134,.16);margin-top:11px;overflow:hidden}
#status .bar i{display:block;height:100%;width:30%;background:var(--navy);border-radius:3px;animation:run 1.15s ease-in-out infinite}
.err{color:#9b1c2e}

.leaflet-control-scale-line{border-color:var(--ink)!important;color:var(--ink);background:rgba(255,255,255,.82);font-weight:700;font-size:11px}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.82)!important}

.hub{display:flex;align-items:center}
.hub .pin{width:27px;height:27px;border-radius:7px;background:var(--navy);border:2px solid #fff;
  box-shadow:0 2px 7px rgba(8,30,55,.5);display:flex;align-items:center;justify-content:center;flex:none;
  transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.hub:hover .pin{transform:scale(1.22)}
.hub .pin svg{width:17px;height:17px;fill:#fff}
.hub .nm{font-weight:800;font-size:12.5px;color:#0e2d47;white-space:nowrap;margin-left:5px;
  text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 8px #fff,0 1px 2px #fff}
.halt{display:block;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #2b4257;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.halt.key{width:11px;height:11px;border-width:2.5px;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.leaflet-tooltip.plain{background:rgba(255,255,255,.92);border:1px solid var(--edge);box-shadow:var(--shadow);
  font-weight:700;font-size:11.5px;color:var(--ink);border-radius:7px;padding:3px 7px}
.leaflet-tooltip.plain::before{display:none}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow)}
.leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.55}
.pop h4{margin:0 0 6px;font-size:14px;color:var(--navy);font-weight:800}
.pop .big{font-size:23px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.pop .tag{display:inline-block;margin-top:7px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;
  background:rgba(47,158,79,.16);color:#1d6b35}
.pop .tag.t{background:rgba(247,154,53,.2);color:#8a4b06}

@keyframes drop{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes run{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}

@media(max-width:980px){
  #right{left:14px;right:14px;top:auto;bottom:14px;width:auto;height:44%;flex-direction:row}
  #right>*{flex:1;min-width:0}#times{min-height:0}
  #title{max-width:calc(100% - 28px);padding:10px 16px 10px 12px}#title p{display:none}
  #slogan,#probe{display:none!important}
}
</style>
</head>
<body>
<div id="map"></div>

<header id="title">
  <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C7.6 2 4 2.5 4 6v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h2.2l2-2h3.6l2 2H18v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-3.6-4-8-4zM7.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.5-6H6V6.5h5V10zm2 0V6.5h5V10h-5zm3.5 6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
  <div>
    <h1>Bereikbaarheid Gent met de trein</h1>
    <h2>Vlaamse Ardennen en ruime omgeving</h2>
    <p>Kleuring = hoe dicht je bij een NMBS-station woont + hoe vlot je vanuit daar de trein naar Gent kan nemen</p>
  </div>
</header>

<div id="probe" class="card"></div>
<div id="slogan">Dichter bij de natuur,<br>vlot naar Gent.</div>
<div id="status" class="card">Kaartgegevens laden&hellip;<div class="bar"><i></i></div></div>

<aside id="right">
  <section class="card" id="ctl">
    <div class="seg">
      <button id="mDist">Afstand tot station</button>
      <button id="mTime" class="on">Reistijd tot Gent</button>
    </div>
    <div class="rng" id="spdRow"><span>Naar station:</span><input id="spd" type="range" min="4" max="50" step="1" value="16"><b id="spdL"></b></div>
    <label class="opt"><input type="checkbox" id="direct"> Enkel rechtstreekse verbindingen</label>
    <label class="opt"><input type="checkbox" id="rail" checked> Spoorlijnen tonen</label>
    <div class="rng"><span>Dekking:</span><input id="op" type="range" min="0.25" max="1" step="0.05" value="0.78"></div>
  </section>

  <section class="card" id="legend"></section>

  <section class="card" id="times">
    <h3>Reistijd met de trein naar Gent</h3>
    <input id="q" placeholder="Zoek een station&hellip;" />
    <ul id="list"></ul>
    <div class="note" id="src"></div>
  </section>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS=['#2f9e4f','#8ed24a','#f7e03d','#f79a35','#e8402e','#8f1b2e'];
const QUAL=['zeer goed','goed','matig','beperkt','slecht','zeer slecht'];
const MODES={
  dist:{cuts:[2,4,6,8,10],unit:'km',title:'Afstand tot een NMBS-station'},
  time:{cuts:[30,45,60,75,90],unit:'min',title:'Reistijd tot Gent (deur tot deur)'}
};
const TRAIN='<svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 2.5 4 6v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h2.2l2-2h3.6l2 2H18v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-3.6-4-8-4zM7.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.5-6H6V6.5h5V10zm2 0V6.5h5V10h-5zm3.5 6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>';
const $=id=>document.getElementById(id);
const S={mode:'time',speed:16,direct:false,solo:null};

/* ---------- kaart: labels bovenop de kleuring ---------- */
const map=L.map('map',{zoomControl:false,minZoom:8,maxZoom:15,zoomSnap:.25}).setView([50.84,3.76],10);
for(const [p,z] of [['base-pane',200],['heat',350],['rail',400],['edge',410],['labels',430]]){
  map.createPane(p).style.zIndex=z;
  if(p!=='base-pane')map.getPane(p).style.pointerEvents='none';
}
// Esri Light Gray Canvas: geen API-sleutel nodig en heeft een aparte labellaag,
// zodat plaatsnamen bovenop de kleuring blijven staan (zoals op de posterkaart).
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_';
const ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &middot; '
  +'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &middot; '
  +'NMBS via <a href="https://docs.irail.be/">iRail</a> &middot; Digitaal Vlaanderen (VRBG)';
const BASES={
  'Licht (Esri)':L.tileLayer(ESRI+'Base/MapServer/tile/{z}/{y}/{x}',{pane:'base-pane',maxZoom:16,attribution:ATTR}),
  'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{pane:'base-pane',maxZoom:19,attribution:ATTR})
};
BASES['Licht (Esri)'].addTo(map);
const LABELS=L.tileLayer(ESRI+'Reference/MapServer/tile/{z}/{y}/{x}',{pane:'labels',maxZoom:16}).addTo(map);
L.control.layers(BASES,{'Plaatsnamen bovenop':LABELS},{position:'bottomleft',collapsed:true}).addTo(map);
// OSM heeft zelf al plaatsnamen: dan de extra labellaag weglaten.
map.on('baselayerchange',e=>{e.name==='OpenStreetMap'?map.removeLayer(LABELS):map.addLayer(LABELS);});
L.control.zoom({position:'bottomleft'}).addTo(map);
L.control.scale({metric:true,imperial:false,position:'bottomright',maxWidth:170}).addTo(map);

const setStatus=(t,err)=>{const s=$('status');if(!t){s.style.display='none';return;}
  s.style.display='';s.innerHTML=(err?`<span class="err">${t}</span>`:t)+(err?'':'<div class="bar"><i></i></div>');};
const getJSON=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u.split('/').pop()+' '+r.status);return r.json();};

let region,outline,stations=[],railLines=[],meta={},railLayer;
async function load(){
  [region,stations]=await Promise.all([getJSON('data/region.geojson'),getJSON('data/stations.json')]);
  try{outline=await getJSON('data/outline.geojson');}catch(e){console.warn('omtrek',e);}
  try{railLines=await getJSON('data/rail.json');}catch(e){console.warn('spoorlijnen',e);}
  try{meta=await getJSON('data/meta.json');}catch(e){}
  stations.forEach(s=>{s.ll=L.latLng(s.lat,s.lon);s.title=s.label||s.name;});
}

/* ---------- regiomasker + hexraster ---------- */
let mask,MW,MH,box,bounds,hexes=[],overlay,cnv,HEXR=7.2;
function buildMask(){
  const crs=L.CRS.EPSG3857;let a=1e12,b=1e12,c=-1e12,d=-1e12;
  const walk=(co,dep,f)=>dep?co.forEach(x=>walk(x,dep-1,f)):f(co);
  region.features.forEach(ft=>walk(ft.geometry.coordinates,ft.geometry.type==='Polygon'?2:3,([lon,lat])=>{
    const p=crs.project(L.latLng(lat,lon));a=Math.min(a,p.x);c=Math.max(c,p.x);b=Math.min(b,p.y);d=Math.max(d,p.y);}));
  box={a,b,c,d};MW=1100;MH=Math.round(MW*(d-b)/(c-a));
  bounds=L.latLngBounds(crs.unproject(L.point(a,b)),crs.unproject(L.point(c,d)));
  cnv=document.createElement('canvas');cnv.width=MW;cnv.height=MH;
  const x=cnv.getContext('2d');
  const tx=([lon,lat])=>{const p=crs.project(L.latLng(lat,lon));return[(p.x-a)/(c-a)*MW,(d-p.y)/(d-b)*MH];};
  x.fillStyle='#000';
  region.features.forEach(ft=>{
    const polys=ft.geometry.type==='Polygon'?[ft.geometry.coordinates]:ft.geometry.coordinates;
    x.beginPath();
    polys.forEach(poly=>poly.forEach(ring=>{
      ring.forEach((pt,i)=>{const[px,py]=tx(pt);i?x.lineTo(px,py):x.moveTo(px,py);});x.closePath();}));
    x.fill('evenodd');
  });
  mask=x.getImageData(0,0,MW,MH).data;mask.tx=tx;
  x.clearRect(0,0,MW,MH);
}
const hit=(i,j)=>i>=0&&j>=0&&i<MW&&j<MH&&mask[(j*MW+i)*4+3]>128;
const inRegion=(lat,lon)=>{const[px,py]=mask.tx([lon,lat]);return hit(Math.round(px),Math.round(py));};

function buildHexes(){
  const crs=L.CRS.EPSG3857,{a,b,c,d}=box,R=HEXR,hw=Math.sqrt(3)*R,vs=1.5*R;
  hexes=[];
  for(let row=0;row*vs<MH+R;row++){
    const y=row*vs,off=row%2?hw/2:0;
    for(let x=off;x<MW+hw;x+=hw){
      if(!hit(Math.round(x),Math.round(y)))continue;
      const p=crs.unproject(L.point(a+x/MW*(c-a),d-y/MH*(d-b)));
      hexes.push({x,y,lat:p.lat,lon:p.lng,kx:Math.cos(p.lat*Math.PI/180)*111.32});
    }
  }
}

/* ---------- berekening + tekenen ---------- */
const pool=()=>stations.filter(s=>!S.direct||s.direct||s.train===0);
const access=km=>km*1.32*60/S.speed;
const bandOf=v=>{const c=MODES[S.mode].cuts;let i=0;while(i<c.length&&v>c[i])i++;return i;};
const nearest=(lat,lon)=>{
  const kx=Math.cos(lat*Math.PI/180)*111.32;let bv=Infinity,bd=0,bs=null;
  for(const s of pool()){
    const d=Math.hypot((lon-s.lon)*kx,(lat-s.lat)*110.57);
    const v=S.mode==='dist'?d:access(d)+s.train;
    if(v<bv){bv=v;bd=d;bs=s;}
  }
  return{v:bv,d:bd,s:bs};
};
let shares=[0,0,0,0,0,0];

function compute(){
  const cs=pool(),cnt=[0,0,0,0,0,0];
  for(const H of hexes){
    let bv=Infinity;
    for(const s of cs){
      const dx=(H.lon-s.lon)*H.kx,dy=(H.lat-s.lat)*110.57,d=Math.sqrt(dx*dx+dy*dy);
      const v=S.mode==='dist'?d:access(d)+s.train;
      if(v<bv)bv=v;
    }
    H.b=bandOf(bv);cnt[H.b]++;
  }
  shares=cnt.map(v=>v/(hexes.length||1));
  paint();legend();
}
function paint(){
  const g=cnv.getContext('2d'),R=HEXR;
  g.clearRect(0,0,MW,MH);g.lineWidth=.6;g.lineJoin='round';
  const pts=[];for(let i=0;i<6;i++){const t=Math.PI/180*(60*i-90);pts.push([Math.cos(t)*R,Math.sin(t)*R]);}
  g.strokeStyle='rgba(255,255,255,.42)';
  for(const H of hexes){
    g.globalAlpha=(S.solo!==null&&S.solo!==H.b)?.1:1;
    g.fillStyle=COLORS[H.b];
    g.beginPath();pts.forEach(([dx,dy],i)=>i?g.lineTo(H.x+dx,H.y+dy):g.moveTo(H.x+dx,H.y+dy));g.closePath();
    g.fill();g.stroke();
  }
  g.globalAlpha=1;
  const url=cnv.toDataURL();
  if(overlay)overlay.setUrl(url);
  else overlay=L.imageOverlay(url,bounds,{pane:'heat',opacity:+$('op').value}).addTo(map);
}

/* ---------- panelen ---------- */
function legend(){
  const M=MODES[S.mode],c=M.cuts,u=M.unit;
  const lab=i=>i===0?`0 – ${c[0]} ${u}`:i===c.length?`> ${c[c.length-1]} ${u}`:`${c[i-1]} – ${c[i]} ${u}`;
  $('legend').innerHTML=`<h3>${M.title}</h3>`+COLORS.map((col,i)=>
    `<div class="band${S.solo!==null&&S.solo!==i?' off':''}" data-b="${i}">
       <span class="sw" style="background:${col}"></span><span>${lab(i)}</span>
       <span class="q">(${QUAL[i]})</span><span class="pct">${(shares[i]*100).toFixed(0)}%</span></div>`).join('')
  +`<div class="sep"></div>
    <div class="sym"><i><svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#2b3f55" stroke-width="2"/></svg></i><span>NMBS-spoorlijn</span></div>
    <div class="sym"><i><span class="halt"></span></i><span>NMBS-station of stopplaats</span></div>
    <div class="sym"><i><span style="width:19px;height:19px;border-radius:5px;background:var(--navy);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="12" height="12" fill="#fff"><path d="M12 2C7.6 2 4 2.5 4 6v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h2.2l2-2h3.6l2 2H18v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-3.6-4-8-4z"/></svg></span></i><span>Station met <b>rechtstreekse</b> verbinding naar Gent</span></div>
    <div class="sym"><i><svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#35506a" stroke-width="2" stroke-dasharray="5 4"/></svg></i><span>Regio Vlaamse Ardennen</span></div>`;
  $('legend').querySelectorAll('.band').forEach(el=>el.onclick=()=>{
    const b=+el.dataset.b;S.solo=S.solo===b?null:b;paint();legend();});
}
function list(){
  const q=$('q').value.trim().toLowerCase();
  const items=stations.filter(s=>s.train>0&&(!S.direct||s.direct)&&s.title.toLowerCase().includes(q))
    .sort((a,b)=>a.train-b.train);
  $('list').innerHTML=items.map(s=>
    `<li data-id="${s.id}"><span class="dot${s.direct?' direct':''}"></span>
      <span class="nm">${s.title}</span><b>${s.train} min</b></li>`).join('')
    ||'<li style="opacity:.6;background:none;cursor:default">Geen station gevonden</li>';
  $('list').querySelectorAll('li[data-id]').forEach(li=>li.onclick=()=>{
    const s=stations.find(x=>x.id===li.dataset.id);
    map.flyTo(s.ll,13,{duration:.8});setTimeout(()=>s.marker&&s.marker.openPopup(),850);});
}

/* ---------- lagen ---------- */
const pop=s=>`<div class="pop"><h4>${s.title}</h4>
  <div class="big">${s.train} min</div>
  <div style="opacity:.7;font-size:11.5px">naar Gent-Sint-Pieters${s.typical&&s.typical>s.train?` &middot; doorsnee ${s.typical} min`:''}</div>
  <span class="tag${s.direct?'':' t'}">${s.direct?'Rechtstreekse trein':(s.transfers||1)+' overstap'+((s.transfers||1)>1?'pen':'')}</span>
  <div class="note" style="margin-top:8px">Dienstregeling NMBS via iRail${s.runs?` &middot; ${s.runs} ritten vergeleken`:''}</div></div>`;

/* Welke stations bedienen de regio echt? Een station telt mee zodra het voor
   minstens één hexagon het dichtstbijzijnde is. Alleen de belangrijkste daarvan
   krijgen een naamlabel, net als op de posterkaart — de rest blijft een stip. */
const MAXLABELS=16;
function markServing(){
  stations.forEach(s=>{s.serves=0;s.labeled=false;});
  for(const H of hexes){
    let bd=Infinity,bs=null;
    for(const s of stations){
      const dx=(H.lon-s.lon)*H.kx,dy=(H.lat-s.lat)*110.57,d=dx*dx+dy*dy;
      if(d<bd){bd=d;bs=s;}
    }
    if(bs)bs.serves++;
  }
  stations.filter(s=>s.serves>0&&s.train>0&&s.direct)
    .sort((a,b)=>b.serves-a.serves)
    .slice(0,MAXLABELS)
    .forEach(s=>s.labeled=true);
}

function draw(){
  L.geoJSON(region,{pane:'edge',interactive:false,
    style:{color:'#4a6276',weight:.8,fill:false,opacity:.45}}).addTo(map);
  if(outline)L.geoJSON(outline,{pane:'edge',interactive:false,
    style:{color:'#20364b',weight:2.4,dashArray:'8 5',fill:false,opacity:.95,lineJoin:'round'}}).addTo(map);
  if(railLines.length){
    railLayer=L.layerGroup(railLines.map(g=>
      L.polyline(g,{pane:'rail',color:'#2b3f55',weight:1.5,opacity:.8,interactive:false}))).addTo(map);
  }
  stations.forEach(s=>{
    const key=s.serves>0&&s.train>0;
    const m=s.labeled
      ? L.marker(s.ll,{zIndexOffset:500,riseOnHover:true,icon:L.divIcon({className:'',iconSize:null,iconAnchor:[13,13],
          html:`<div class="hub"><span class="pin">${TRAIN}</span><span class="nm">${s.title}</span></div>`})})
      : L.marker(s.ll,{zIndexOffset:key?200:0,icon:L.divIcon({className:'',iconSize:[9,9],iconAnchor:[4.5,4.5],
          html:`<span class="halt${key?' key':''}"></span>`})})
          .bindTooltip(s.title,{className:'plain',direction:'top',offset:[0,-5]});
    if(s.train>0)m.bindPopup(()=>pop(s),{closeButton:false,offset:[0,-4]});
    s.marker=m;m.addTo(map);
  });
  const g=stations.find(s=>s.train===0);
  if(g)L.circleMarker(g.ll,{radius:9,color:'#fff',weight:3,fillColor:'#0d3c6e',fillOpacity:1})
    .bindTooltip('Gent-Sint-Pieters',{className:'plain',permanent:true,direction:'top',offset:[0,-9]}).addTo(map);
}

/* ---------- interactie ---------- */
map.on('mousemove',e=>{
  if(!hexes.length)return;
  const{lat,lng}=e.latlng;
  if(!inRegion(lat,lng)){$('probe').style.display='none';return;}
  const n=nearest(lat,lng);if(!n.s)return;
  $('probe').style.display='block';
  $('probe').innerHTML=`<div class="h">${n.s.title}</div>
    <div>Dichtstbijzijnde station &middot; <span class="v">${n.d.toFixed(1)} km</span></div>
    <div>Trein naar Gent &middot; <span class="v">${n.s.train} min</span>${n.s.direct?' (rechtstreeks)':''}</div>
    <div style="margin-top:4px;font-weight:700">Totaal ± <span class="v">${Math.round(access(n.d)+n.s.train)} min</span> deur tot deur</div>`;
});
map.on('mouseout',()=>$('probe').style.display='none');

const setMode=m=>{S.mode=m;$('mDist').classList.toggle('on',m==='dist');$('mTime').classList.toggle('on',m==='time');
  $('spdRow').hidden=m!=='time';compute();};
$('mDist').onclick=()=>setMode('dist');
$('mTime').onclick=()=>setMode('time');
const spdL=()=>{const v=+$('spd').value;$('spdL').textContent=`${v} km/u · ${v<=6?'te voet':v<=27?'fiets':'auto'}`;};
$('spd').oninput=()=>{S.speed=+$('spd').value;spdL();compute();};
$('direct').onchange=e=>{S.direct=e.target.checked;compute();list();};
$('rail').onchange=e=>{if(railLayer)e.target.checked?map.addLayer(railLayer):map.removeLayer(railLayer);};
$('op').oninput=e=>overlay&&overlay.setOpacity(+e.target.value);
$('q').oninput=list;
spdL();

/* ---------- start ---------- */
(async()=>{
  try{
    await load();
    setStatus('Kaart opbouwen&hellip;');
    buildMask();buildHexes();markServing();draw();compute();list();
    $('src').innerHTML='Reistijden: dienstregeling NMBS via <a href="https://docs.irail.be/" target="_blank" rel="noopener">iRail</a>'
      +(meta.built?` (${meta.built.slice(0,10)})`:'')
      +'. Gemeentegrenzen: Digitaal Vlaanderen (VRBG) &amp; OpenStreetMap. "Reistijd tot Gent" = toegang tot het station + treinrit. '
      +'<a href="about.html">Hoe is deze kaart gemaakt? &rarr;</a>';
    map.fitBounds(bounds,{padding:[30,30],animate:false});
    setStatus('');
  }catch(e){
    console.error(e);
    setStatus(`Kon de gegevens niet laden (${e.message}).<br><br>Draai eerst <b>python build_data.py</b> zodat de map <code>data/</code> gevuld is.`,true);
  }
})();
</script>
</body>
